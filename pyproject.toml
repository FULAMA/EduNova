[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edunova"
version = "0.1.0"
description = "SaaS ERP Ã©ducatif multi-tenant"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "PyJWT==2.13.0",
    "PyOTP==2.10.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "bandit==1.7.5",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "ruff==0.1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
mypy_path = "."
[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
