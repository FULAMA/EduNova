name: EduNova CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  edunova-check:
    runs-on: windows-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: pip install -e ".[dev]"

      - name: Compilation
        run: python -m compileall -q src tests

      - name: Mypy
        run: mypy --explicit-package-bases src

      - name: Ruff
        run: ruff check src tests

      - name: Bandit
        run: bandit -r src -ll

      - name: pip-audit (n'échoue pas le build)
        run: pip-audit || echo "::warning::pip-audit a signalé des vulnérabilités"
        continue-on-error: true

      - name: Tests complets
        run: pytest -q --basetemp=.pytest_tmp

      - name: Détection REVIEW (migrations / domaine)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $diff = git diff --name-only origin/main...HEAD
          $reviewFiles = $diff | Where-Object { $_ -match "migrations" -or $_ -match "src[/\\].*domain" }
          if ($reviewFiles) {
            $reviewFiles | ForEach-Object { Write-Host "::warning file=$_::Changement domaine/migration à relire" }
          }
